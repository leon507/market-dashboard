name: Daily Market Dashboard Refresh

on:
  schedule:
    # Multiple cron times for redundancy (GitHub Actions free tier delays can be 1-2+ hours)
    # Target: after A-share market close at 15:00 Beijing time (07:00 UTC)
    # Primary: 06:00 UTC (14:00 Beijing) - accounts for ~1-2hr delay
    # Backup:  09:00 UTC (17:00 Beijing) - catches up if primary was skipped
    - cron: "0 6 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]
    # Prevent infinite loop: only run if push is NOT from the bot itself
    paths-ignore:
      - "data/**"
      - "index.html"
      - "market_dashboard.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch latest market data
        run: |
          python fetch_data_standalone.py

      - name: Generate dashboard HTML
        run: |
          python generate_site.py

      - name: Copy to index.html for GitHub Pages
        run: |
          cp market_dashboard.html index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html market_dashboard.html
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
