name: Daily Market Dashboard Refresh

on:
  schedule:
    # Run at 07:30 UTC = 15:30 Beijing time, every weekday
    - cron: "30 7 * * 1-5"
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main] # Run on first push to deploy immediately

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch latest market data
        run: |
          python fetch_data_standalone.py

      - name: Generate dashboard HTML
        run: |
          python generate_site.py

      - name: Copy to index.html for GitHub Pages
        run: |
          cp market_dashboard.html index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html market_dashboard.html
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
